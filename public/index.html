<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARIA STUDIO</title>
<style>
:root{
  --bg:#f2eee8; --panel:#fbfaf7; --line:#e4ded4; --ink:#18171b; --mut:#847e88; --acc:#e8447f;
  --serif:"New York","Iowan Old Style","Palatino Linotype",ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Roboto,sans-serif;
}
html.dark{--bg:#1b1a1f;--panel:#232228;--line:#35333c;--ink:#ecebef;--mut:#9d98a5;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;grid-template-rows:48px minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-size:17px;letter-spacing:.22em}
.logo i{font-style:normal;color:var(--acc)}
.right{display:flex;align-items:center;gap:10px}
main{display:flex;align-items:center;justify-content:center;padding:16px}
.card{max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--serif);font-weight:500;font-size:24px}
.card p{color:var(--mut);font-size:14px;line-height:1.55}
</style>
</head>
<body>
<script src="cuenta.js"></script>
<header>
  <div class="logo">ARIA<i>STUDIO</i></div>
  <div class="right"></div>
</header>
<main>
  <div class="card">
    <h2>Ya estás dentro ✨</h2>
    <p>Tu cuenta está conectada. El estudio (tus personajes, la Fototeca y Crear imagen) se está subiendo a la web y aparecerá aquí.</p>
  </div>
</main>
</body>
</html>
