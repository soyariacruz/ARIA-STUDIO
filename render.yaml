# ARIA STUDIO - servidor (Render): el mismo puente de la app local, en modo de varias cuentas.
# La web (public/) la publica Vercel; login, miembros, catalogo y biblioteca estan en Supabase.
# Variables: ARIA_ORIGENES = webs que pueden hablar con el servidor; ARIA_FETCH_HOSTS = arrastrar imagenes desde otras webs;
# ARIA_CUOTA_GB = tope de espacio por cuenta; ARIA_SECRETO = cifra las claves de API de las cuentas (lo genera Render);
# ARIA_ADMIN = llave de la copia de seguridad; SUPABASE_SECRET = para leer el catalogo privado (se pega a mano).
# Opcionales, se pegan a mano en Render > Environment (no van en este fichero):
#   ARIA_CASA_WS = clave de WaveSpeed "de la casa": activa el saldo regalo (sin ella no existe); ARIA_CASA_TOPE = tope en $ al mes entre todas las cuentas (1000);
#   PIXABAY_KEY o PEXELS_KEY = buscador de fotos de Lugares.
services:
  - type: web
    name: aria-studio
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: servidor
    buildCommand: pip install -r requirements.txt && pip install --no-deps mediapipe==1.1.0
    startCommand: python3 puente.py
    healthCheckPath: /salud
    buildFilter:
      paths:
        - servidor/**
        - render.yaml
    disk:
      name: datos
      mountPath: /datos
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: ARIA_SERVIDOR
        value: "1"
      - key: ARIA_HOST
        value: "0.0.0.0"
      - key: ARIA_DATOS
        value: /datos
      - key: ARIA_ORIGENES
        value: https://aria-studio-eta.vercel.app,https://studio.ariacruz.com,https://ariacruz.com
      - key: ARIA_FETCH_HOSTS
        value: "*"
      - key: ARIA_CUOTA_GB
        value: "3"
      - key: ARIA_SECRETO
        generateValue: true
      - key: ARIA_ADMIN
        generateValue: true
      - key: SUPABASE_SECRET
        sync: false
